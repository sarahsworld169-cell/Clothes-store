<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Login | Sarah's World</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 35px;
      border-radius: 12px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    .logo {
      text-align: center;
      margin-bottom: 30px;
    }

    .logo h1 {
      font-size: 28px;
      margin-bottom: 8px;
    }

    .logo p {
      color: #777;
      font-size: 14px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    .login-btn {
      width: 100%;
      padding: 13px;
      background: #111;
      color: white;
      border: none;
      border-radius: 7px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      font-size: 14px;
      text-align: center;
    }

    .error {
      display: block;
      background: #ffe8e8;
      color: #c00000;
    }

    .success {
      display: block;
      background: #e7f8ed;
      color: #16833b;
    }

    .back {
      text-align: center;
      margin-top: 20px;
    }

    .back a {
      color: #111;
      text-decoration: none;
      font-size: 14px;
    }

    .back a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      <h1>Sarah's World</h1>
      <p>Login to your account</p>
    </div>

    <form id="loginForm">

      <div class="form-group">
        <label for="email">Email</label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          required
        >
      </div>


      <div class="form-group">
        <label for="password">Password</label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        >
      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>

    </form>


    <div
      id="message"
      class="message"
    ></div>


    <div class="back">
      <a href="/">
        ← Back to Store
      </a>
    </div>

  </div>


  <script>

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        `message ${type}`;

    }


    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim()
            .toLowerCase();


        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          showMessage(
            "Please enter email and password.",
            "error"
          );

          return;

        }


        loginBtn.disabled = true;

        loginBtn.textContent = "Logging in...";


        try {

          const response =
            await fetch(
              "/api/auth/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email,
                  password
                })
              }
            );


          const data =
            await response.json();


          if (!response.ok || !data.success) {

            showMessage(
              data.message ||
              "Invalid email or password.",
              "error"
            );

            return;

          }


          /* =========================
             SAVE LOGIN
          ========================= */

          localStorage.setItem(
            "token",
            data.token
          );


          localStorage.setItem(
            "authToken",
            data.token
          );


          localStorage.setItem(
            "user",
            JSON.stringify(data.user)
          );


          showMessage(
            "Login successful! Redirecting...",
            "success"
          );


          /* =========================
             REDIRECT
          ========================= */

          setTimeout(() => {

            if (
              data.user &&
              (
                data.user.role === "admin" ||
                data.user.role === "owner"
              )
            ) {

              window.location.href =
                "/admin/index.html";

            } else {

              window.location.href =
                "/";

            }

          }, 700);


        } catch (error) {

          console.error(error);

          showMessage(
            "Could not connect to the server.",
            "error"
          );

        } finally {

          loginBtn.disabled = false;

          loginBtn.textContent = "Login";

        }

      }
    );

  </script>

</body>
      </html>

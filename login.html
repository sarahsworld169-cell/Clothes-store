<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sarah's World | Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #111;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      background: white;
      padding: 40px;
      border-radius: 16px;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 17px;
      margin-bottom: 32px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 9px;
      font-size: 16px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
    }

    input:focus {
      border-color: #111;
    }

    .login-btn {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 15px;
      border-radius: 8px;
      font-size: 17px;
      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #222;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 8px;
      text-align: center;
      font-size: 14px;
    }

    .message.success {
      display: block;
      background: #e8f7e8;
      color: #187a18;
    }

    .message.error {
      display: block;
      background: #ffe8e8;
      color: #c00000;
    }

    .links {
      text-align: center;
      margin-top: 25px;
      line-height: 2.2;
    }

    .links a {
      color: #111;
      text-decoration: none;
      font-size: 15px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .register-link {
      font-weight: bold;
    }

    @media (max-width: 600px) {
      .container {
        padding: 30px 22px;
      }

      h1 {
        font-size: 30px;
      }

      .subtitle {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Sarah's World</h1>

    <p class="subtitle">
      Login to your account
    </p>


    <!-- LOGIN FORM -->

    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required
        >

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          autocomplete="current-password"
          required
        >

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn"
      >
        Login
      </button>

    </form>


    <!-- MESSAGE -->

    <div
      id="message"
      class="message"
    ></div>


    <!-- LINKS -->

    <div class="links">

      <a
        href="/register.html"
        class="register-link"
      >
        Create New Account
      </a>

      <br>

      <a href="/">
        ← Back to Store
      </a>

    </div>

  </div>


  <script>

    const loginForm =
      document.getElementById("loginForm");

    const loginBtn =
      document.getElementById("loginBtn");

    const message =
      document.getElementById("message");


    /* =========================
       SHOW MESSAGE
    ========================= */

    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          showMessage(
            "Email and password are required.",
            "error"
          );

          return;
        }


        loginBtn.disabled = true;

        loginBtn.textContent =
          "Logging in...";


        message.className =
          "message";


        try {

          const response =
            await fetch(
              "/api/auth/login",
              {
                method: "POST",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({
                  email,
                  password
                })
              }
            );


          const data =
            await response.json();


          if (
            !response.ok ||
            !data.success
          ) {

            throw new Error(
              data.message ||
              "Invalid email or password."
            );

          }


          /* =========================
             SAVE TOKEN
          ========================= */

          if (data.token) {

            localStorage.setItem(
              "token",
              data.token
            );

          }


          /* =========================
             SAVE USER
          ========================= */

          if (data.user) {

            localStorage.setItem(
              "user",
              JSON.stringify(data.user)
            );

          }


          showMessage(
            "Login successful! Redirecting...",
            "success"
          );


          /* =========================
             REDIRECT
          ========================= */

          setTimeout(() => {

            if (
              data.user &&
              (
                data.user.role === "admin" ||
                data.user.role === "owner"
              )
            ) {

              window.location.href =
                "/admin/index.html";

            } else {

              window.location.href =
                "/";

            }

          }, 1000);


        } catch (error) {

          console.error(
            "Login Error:",
            error
          );

          showMessage(
            error.message ||
            "Login failed. Please try again.",
            "error"
          );


          loginBtn.disabled = false;

          loginBtn.textContent =
            "Login";

        }

      }
    );

  </script>

</body>
</html>

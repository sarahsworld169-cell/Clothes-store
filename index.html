<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sarah's World | Clothing Store</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #111;
    }

    nav {
      background: #111;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      gap: 20px;
    }

    nav h1 {
      font-size: 24px;
      white-space: nowrap;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 15px;
    }

    .hero {
      min-height: 360px;
      padding: 70px 7%;
      display: flex;
      align-items: center;
      background: #e9e9e9;
    }

    .hero-text {
      max-width: 650px;
    }

    .hero h2 {
      font-size: 48px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 18px;
      margin-bottom: 25px;
      color: #555;
    }

    .btn {
      display: inline-block;
      background: #111;
      color: white;
      padding: 13px 24px;
      border-radius: 6px;
      text-decoration: none;
    }

    .shop {
      padding: 55px 7%;
    }

    .shop-header {
      text-align: center;
      margin-bottom: 30px;
    }

    .shop-header h2 {
      font-size: 32px;
      margin-bottom: 20px;
    }

    .search-box {
      max-width: 600px;
      margin: auto;
      display: flex;
      gap: 8px;
    }

    .search-box input {
      flex: 1;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
    }

    .search-box button {
      border: none;
      background: #111;
      color: white;
      padding: 0 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    .category-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 25px 0;
    }

    .category-btn {
      border: 1px solid #ccc;
      background: white;
      padding: 9px 16px;
      border-radius: 20px;
      cursor: pointer;
    }

    .category-btn.active,
    .category-btn:hover {
      background: #111;
      color: white;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 22px;
    }

    .product {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,0.08);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .product:hover {
      transform: translateY(-4px);
    }

    .product img {
      width: 100%;
      height: 280px;
      object-fit: cover;
      display: block;
    }

    .product-info {
      padding: 16px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 8px;
    }

    .product-category {
      color: #777;
      font-size: 13px;
      margin-bottom: 12px;
    }

    .view-btn {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 11px;
      border-radius: 6px;
      cursor: pointer;
    }

    .loading,
    .no-products {
      text-align: center;
      padding: 40px;
      color: #666;
      grid-column: 1 / -1;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 25px;
      margin-top: 30px;
    }

    @media (max-width: 700px) {
      nav {
        padding: 15px 5%;
        flex-wrap: wrap;
      }

      nav h1 {
        font-size: 20px;
      }

      nav a {
        margin-left: 8px;
        font-size: 13px;
      }

      .hero {
        padding: 55px 5%;
      }

      .hero h2 {
        font-size: 36px;
      }

      .shop {
        padding: 45px 5%;
      }

      .search-box {
        flex-direction: column;
      }

      .search-box button {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <h1>Sarah's World</h1>

    <div>
      <a href="/">Home</a>
      <a href="#shop">Shop</a>
      <a href="/cart.html">🛒 Cart</a>
      <a href="/login.html">Login</a>
    </div>
  </nav>


  <section class="hero">
    <div class="hero-text">
      <h2>Style That Fits You.</h2>

      <p>
        Discover our latest collection and find something you love.
      </p>

      <a href="#shop" class="btn">
        Shop Now
      </a>
    </div>
  </section>


  <section class="shop" id="shop">

    <div class="shop-header">

      <h2>Latest Collection</h2>

      <div class="search-box">
        <input
          type="text"
          id="searchInput"
          placeholder="Search products..."
        >

        <button onclick="searchProducts()">
          Search
        </button>
      </div>

    </div>


    <div id="categoryBar" class="category-bar"></div>


    <div
      id="productsContainer"
      class="product-grid"
    >
      <div class="loading">
        Loading products...
      </div>
    </div>

  </section>


  <footer>
    <p>
      © 2026 Sarah's World. All rights reserved.
    </p>
  </footer>


  <script>

    let allProducts = [];
    let selectedCategory = "all";


    /* =========================
       LOAD PRODUCTS
    ========================= */

    async function loadProducts() {

      const container =
        document.getElementById("productsContainer");

      try {

        const response =
          await fetch("/api/products");

        const data =
          await response.json();

        if (!response.ok || !data.success) {
          throw new Error(
            data.message || "Could not load products."
          );
        }

        allProducts = data.products || [];

        createCategories();

        renderProducts(allProducts);

      } catch (error) {

        console.error(error);

        container.innerHTML = `
          <div class="no-products">
            <h3>Could not load products.</h3>
            <p>Please try again later.</p>
          </div>
        `;
      }
    }


    /* =========================
       CREATE CATEGORIES
    ========================= */

    function createCategories() {

      const categoryBar =
        document.getElementById("categoryBar");

      const categories = [
        "all",
        ...new Set(
          allProducts
            .map(product => product.category_name)
            .filter(Boolean)
        )
      ];

      categoryBar.innerHTML = "";

      categories.forEach(category => {

        const button =
          document.createElement("button");

        button.className =
          "category-btn" +
          (category === "all" ? " active" : "");

        button.textContent =
          category === "all"
            ? "All"
            : category;

        button.onclick = () => {

          selectedCategory = category;

          document
            .querySelectorAll(".category-btn")
            .forEach(btn =>
              btn.classList.remove("active")
            );

          button.classList.add("active");

          filterProducts();
        };

        categoryBar.appendChild(button);

      });
    }


    /* =========================
       SEARCH
    ========================= */

    function searchProducts() {
      filterProducts();
    }


    document
      .getElementById("searchInput")
      .addEventListener("input", filterProducts);


    /* =========================
       FILTER
    ========================= */

    function filterProducts() {

      const search =
        document
          .getElementById("searchInput")
          .value
          .trim()
          .toLowerCase();

      const filtered =
        allProducts.filter(product => {

          const name =
            String(product.name || "")
              .toLowerCase();

          const description =
            String(product.description || "")
              .toLowerCase();

          const category =
            String(product.category_name || "")
              .toLowerCase();

          const matchesSearch =
            !search ||
            name.includes(search) ||
            description.includes(search) ||
            category.includes(search);

          const matchesCategory =
            selectedCategory === "all" ||
            category === selectedCategory.toLowerCase();

          return matchesSearch && matchesCategory;
        });

      renderProducts(filtered);
    }


    /* =========================
       RENDER PRODUCTS
    ========================= */

    function renderProducts(products) {

      const container =
        document.getElementById("productsContainer");

      container.innerHTML = "";

      if (!products.length) {

        container.innerHTML = `
          <div class="no-products">
            <h3>No products found.</h3>
            <p>Try another search.</p>
          </div>
        `;

        return;
      }


      products.forEach(product => {

        const card =
          document.createElement("div");

        card.className = "product";


        const image =
          product.image_url ||
          product.image ||
          "https://via.placeholder.com/600x600?text=No+Image";


        card.innerHTML = `

          <img
            src="${escapeHtml(image)}"
            alt="${escapeHtml(product.name || "Product")}"
          >

          <div class="product-info">

            <h3>
              ${escapeHtml(product.name || "Unnamed Product")}
            </h3>

            <div class="price">
              ৳${Number(product.price || 0).toLocaleString()}
            </div>

            <div class="product-category">
              ${escapeHtml(product.category_name || "Product")}
            </div>

            <button class="view-btn">
              View Details
            </button>

          </div>
        `;


        card.onclick = () => {
          openProduct(product.id);
        };


        container.appendChild(card);

      });
    }


    /* =========================
       OPEN PRODUCT
    ========================= */

    function openProduct(productId) {

      if (!productId) {
        alert("Product ID not available.");
        return;
      }

      window.location.href =
        `/product.html?id=${encodeURIComponent(productId)}`;
    }


    /* =========================
       BASIC HTML ESCAPE
    ========================= */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================
       START
    ========================= */

    loadProducts();

  </script>

</body>
</html>

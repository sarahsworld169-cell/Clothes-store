<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Shopping Cart | Sarah's World</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f7f7f7;
      color: #111;
    }

    nav {
      background: #111;
      color: white;
      padding: 18px 7%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav h1 {
      font-size: 24px;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 18px;
    }

    .container {
      max-width: 1000px;
      margin: 45px auto;
      padding: 0 20px;
    }

    h2 {
      margin-bottom: 25px;
    }

    .cart-layout {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 25px;
    }

    .cart-items,
    .summary {
      background: white;
      border-radius: 10px;
      padding: 20px;
    }

    .cart-item {
      display: flex;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .cart-item:last-child {
      border-bottom: none;
    }

    .cart-item img {
      width: 100px;
      height: 110px;
      object-fit: cover;
      border-radius: 8px;
      background: #eee;
    }

    .item-info {
      flex: 1;
    }

    .item-info h3 {
      margin-bottom: 8px;
    }

    .item-price {
      font-weight: bold;
      margin-bottom: 12px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border: none;
      background: #111;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }

    .remove {
      margin-top: 10px;
      border: none;
      background: #d00;
      color: white;
      padding: 7px 11px;
      border-radius: 5px;
      cursor: pointer;
    }

    .summary h3 {
      margin-bottom: 20px;
    }

    .summary-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .total {
      border-top: 1px solid #ddd;
      padding-top: 15px;
      margin-top: 15px;
      font-size: 20px;
      font-weight: bold;
    }

    .checkout-btn {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      background: #111;
      color: white;
      border-radius: 7px;
      cursor: pointer;
      font-size: 16px;
    }

    .continue {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #111;
      text-decoration: none;
    }

    .empty {
      text-align: center;
      padding: 50px 20px;
    }

    .empty a {
      display: inline-block;
      margin-top: 15px;
      background: #111;
      color: white;
      padding: 12px 20px;
      border-radius: 6px;
      text-decoration: none;
    }

    @media (max-width: 750px) {
      .cart-layout {
        grid-template-columns: 1fr;
      }

      .cart-item img {
        width: 80px;
        height: 90px;
      }
    }
  </style>
</head>

<body>

  <nav>
    <h1>Sarah's World</h1>

    <div>
      <a href="/">Home</a>
      <a href="/cart.html">🛒 Cart</a>
      <a href="/login.html">Login</a>
    </div>
  </nav>


  <main class="container">

    <h2>Shopping Cart 🛒</h2>

    <div id="cartContainer"></div>

  </main>


  <script>

    let cart =
      JSON.parse(
        localStorage.getItem("cart") || "[]"
      );


    /* =========================
       SAVE CART
    ========================= */

    function saveCart() {

      localStorage.setItem(
        "cart",
        JSON.stringify(cart)
      );
    }


    /* =========================
       RENDER CART
    ========================= */

    function renderCart() {

      const container =
        document.getElementById(
          "cartContainer"
        );


      if (!cart.length) {

        container.innerHTML = `

          <div class="cart-items empty">

            <h2>
              Your cart is empty 🛒
            </h2>

            <p>
              Add some products to your cart.
            </p>

            <a href="/">
              Continue Shopping
            </a>

          </div>

        `;

        return;
      }


      let subtotal = 0;


      cart.forEach(item => {

        subtotal +=
          Number(item.price) *
          Number(item.quantity);

      });


      container.innerHTML = `

        <div class="cart-layout">

          <div class="cart-items">

            ${cart.map((item, index) => `

              <div class="cart-item">

                <img
                  src="${escapeHtml(item.image || "")}"
                  alt="${escapeHtml(item.name)}"
                >

                <div class="item-info">

                  <h3>
                    ${escapeHtml(item.name)}
                  </h3>

                  <div class="item-price">
                    ৳${Number(
                      item.price
                    ).toLocaleString()}
                  </div>

                  <div class="quantity">

                    <button
                      onclick="changeQuantity(${index}, -1)"
                    >
                      −
                    </button>

                    <span>
                      ${item.quantity}
                    </span>

                    <button
                      onclick="changeQuantity(${index}, 1)"
                    >
                      +
                    </button>

                  </div>

                  <button
                    class="remove"
                    onclick="removeItem(${index})"
                  >
                    Remove
                  </button>

                </div>

              </div>

            `).join("")}

          </div>


          <div class="summary">

            <h3>
              Order Summary
            </h3>

            <div class="summary-row">

              <span>
                Subtotal
              </span>

              <span>
                ৳${subtotal.toLocaleString()}
              </span>

            </div>

            <div class="summary-row">

              <span>
                Delivery
              </span>

              <span>
                Calculated at checkout
              </span>

            </div>

            <div class="summary-row total">

              <span>
                Total
              </span>

              <span>
                ৳${subtotal.toLocaleString()}
              </span>

            </div>

            <button
              class="checkout-btn"
              onclick="goToCheckout()"
            >
              Proceed to Checkout
            </button>

            <a
              href="/"
              class="continue"
            >
              ← Continue Shopping
            </a>

          </div>

        </div>

      `;
    }


    /* =========================
       CHANGE QUANTITY
    ========================= */

    function changeQuantity(index, amount) {

      cart[index].quantity =
        Number(cart[index].quantity) + amount;


      if (cart[index].quantity <= 0) {

        cart.splice(index, 1);

      }


      saveCart();
      renderCart();
    }


    /* =========================
       REMOVE ITEM
    ========================= */

    function removeItem(index) {

      cart.splice(index, 1);

      saveCart();
      renderCart();
    }


    /* =========================
       CHECKOUT
    ========================= */

    function goToCheckout() {

      if (!cart.length) {

        alert("Your cart is empty.");

        return;
      }

      window.location.href =
        "/checkout.html";
    }


    /* =========================
       HTML ESCAPE
    ========================= */

    function escapeHtml(value) {

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================
       START
    ========================= */

    renderCart();

  </script>

</body>
</html>

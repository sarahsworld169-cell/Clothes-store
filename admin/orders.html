<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orders | Sarah's World Admin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: #111;
      color: white;
      padding: 25px 15px;
    }

    .sidebar h1 {
      font-size: 22px;
      margin-bottom: 30px;
      padding-left: 10px;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 13px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #292929;
    }

    .logout {
      position: absolute;
      bottom: 25px;
      left: 15px;
      right: 15px;
      width: calc(100% - 30px);
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #d00000;
      color: white;
      cursor: pointer;
    }

    .main {
      margin-left: 240px;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .topbar h2 {
      font-size: 28px;
    }

    .refresh-btn {
      border: none;
      background: #111;
      color: white;
      padding: 11px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .filters {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .filters select,
    .filters input {
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    .orders-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .order-card {
      background: white;
      border-radius: 10px;
      padding: 22px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .order-id {
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .pending {
      background: #fff3cd;
      color: #856404;
    }

    .accepted,
    .processing {
      background: #e7f8ed;
      color: #16833b;
    }

    .shipped {
      background: #e7f0ff;
      color: #2457a6;
    }

    .delivered {
      background: #dff7ff;
      color: #087990;
    }

    .cancelled {
      background: #ffe8e8;
      color: #c00000;
    }

    .order-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-box {
      background: #f8f8f8;
      padding: 12px;
      border-radius: 6px;
    }

    .info-box strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #666;
    }

    .items-title {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .order-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .item-image {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      background: #eee;
    }

    .item-info {
      flex: 1;
    }

    .item-info strong {
      display: block;
      margin-bottom: 4px;
    }

    .item-info span {
      color: #666;
      font-size: 13px;
    }

    .order-total {
      text-align: right;
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 10px;
    }

    .order-total p {
      margin: 5px 0;
    }

    .grand-total {
      font-size: 21px;
      font-weight: bold;
    }

    .order-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
      flex-wrap: wrap;
    }

    .accept-btn,
    .cancel-btn,
    .status-btn {
      border: none;
      padding: 10px 17px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .accept-btn {
      background: #16833b;
      color: white;
    }

    .cancel-btn {
      background: #d00000;
      color: white;
    }

    .status-btn {
      background: #111;
      color: white;
    }

    .status-select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: white;
    }

    .disabled-btn {
      background: #ccc;
      color: #666;
      border: none;
      padding: 10px 17px;
      border-radius: 6px;
      cursor: not-allowed;
    }

    .empty {
      background: white;
      padding: 50px;
      text-align: center;
      border-radius: 10px;
      color: #777;
    }

    .loading {
      background: white;
      padding: 40px;
      text-align: center;
      border-radius: 10px;
      color: #666;
    }

    .error {
      background: #ffe8e8;
      color: #c00000;
      padding: 20px;
      border-radius: 8px;
      text-align: center;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    .modal-box h3 {
      margin-bottom: 15px;
    }

    .modal-box textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    .modal-actions button {
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .confirm-cancel {
      background: #d00000;
      color: white;
    }

    .close-modal {
      background: #ddd;
    }

    @media (max-width: 700px) {

      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        padding: 15px;
      }

      .sidebar h1 {
        margin-bottom: 15px;
      }

      .sidebar a {
        display: inline-block;
        margin-right: 5px;
      }

      .logout {
        position: static;
        width: 100%;
        margin-top: 10px;
      }

      .main {
        margin-left: 0;
        padding: 20px 15px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .order-info {
        grid-template-columns: 1fr;
      }

      .order-header {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
      }

      .order-actions {
        justify-content: stretch;
      }

      .accept-btn,
      .cancel-btn,
      .status-btn,
      .status-select {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <h1>Sarah's World</h1>

    <a href="index.html">
      🏠 Dashboard
    </a>

    <a href="products.html">
      🛍️ Products
    </a>

    <a href="orders.html" class="active">
      📦 Orders
    </a>

    <a href="users.html">
      👥 Users
    </a>

    <a href="settings.html">
      ⚙️ Settings
    </a>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </aside>


  <main class="main">

    <div class="topbar">

      <h2>Orders</h2>

      <button
        class="refresh-btn"
        onclick="loadOrders()"
      >
        🔄 Refresh
      </button>

    </div>


    <div class="filters">

      <select
        id="status-filter"
        onchange="filterOrders()"
      >

        <option value="all">
          All Orders
        </option>

        <option value="pending">
          Pending
        </option>

        <option value="accepted">
          Accepted
        </option>

        <option value="processing">
          Processing
        </option>

        <option value="shipped">
          Shipped
        </option>

        <option value="delivered">
          Delivered
        </option>

        <option value="cancelled">
          Cancelled
        </option>

      </select>

      <input
        type="search"
        id="search-order"
        placeholder="Search order ID..."
        oninput="filterOrders()"
      >

    </div>


    <div
      class="orders-container"
      id="orders-container"
    >

      <div class="loading">
        Loading orders...
      </div>

    </div>

  </main>


  <div
    class="modal"
    id="cancel-modal"
  >

    <div class="modal-box">

      <h3>
        Cancel Order
      </h3>

      <p style="margin-bottom: 12px; color: #666;">
        Write a cancellation reason.
        If you leave it empty, the default reason
        from Admin Settings will be used.
      </p>

      <textarea
        id="cancel-reason"
        placeholder="Write cancellation reason (optional)"
      ></textarea>

      <div class="modal-actions">

        <button
          class="close-modal"
          onclick="closeCancelModal()"
        >
          Back
        </button>

        <button
          class="confirm-cancel"
          onclick="confirmCancel()"
        >
          Cancel Order
        </button>

      </div>

    </div>

  </div>


  <script>

    /* =========================
       API CONFIG
    ========================= */

    /*
      If your Railway API uses another URL,
      change this value.

      Example:
      https://your-project.up.railway.app
    */

    const API_BASE_URL = "";


    let selectedOrderId = null;
    let orders = [];


    /* =========================
       AUTH TOKEN
    ========================= */

    function getToken() {

      return (
        localStorage.getItem("token") ||
        localStorage.getItem("authToken")
      );

    }


    /* =========================
       API REQUEST
    ========================= */

    async function apiRequest(url, options = {}) {

      const token = getToken();

      const headers = {
        "Content-Type": "application/json",
        ...(options.headers || {})
      };


      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }


      const response =
        await fetch(
          API_BASE_URL + url,
          {
            ...options,
            headers
          }
        );


      let data = {};

      try {
        data = await response.json();
      } catch {
        data = {};
      }


      if (!response.ok) {

        throw new Error(
          data.message ||
          "Something went wrong."
        );

      }


      return data;

    }


    /* =========================
       LOAD ORDERS
    ========================= */

    async function loadOrders() {

      const container =
        document.getElementById("orders-container");


      container.innerHTML = `
        <div class="loading">
          Loading orders...
        </div>
      `;


      try {

        const data =
          await apiRequest(
            "/api/admin/orders"
          );


        orders =
          Array.isArray(data.orders)
            ? data.orders
            : [];


        filterOrders();


      } catch (error) {

        console.error(error);


        container.innerHTML = `
          <div class="error">
            ❌ ${escapeHtml(error.message)}
            <br><br>
            <button
              class="refresh-btn"
              onclick="loadOrders()"
            >
              Try Again
            </button>
          </div>
        `;

      }

    }


    /* =========================
       RENDER ORDERS
    ========================= */

    function renderOrders(list = orders) {

      const container =
        document.getElementById("orders-container");


      if (list.length === 0) {

        container.innerHTML = `
          <div class="empty">
            📦
            <br><br>
            No orders found.
          </div>
        `;

        return;
      }


      container.innerHTML = "";


      list.forEach(order => {

        const card =
          document.createElement("div");


        card.className = "order-card";


        const status =
          order.order_status || "pending";


        const customerName =
          order.customer_name || "Customer";


        const customerPhone =
          order.customer_phone || "Not available";


        const customerEmail =
          order.customer_email || "Not available";


        const area =
          order.area_name || "Not available";


        const address =
          order.delivery_address || "Not available";


        card.innerHTML = `

          <div class="order-header">

            <div class="order-id">
              Order #${order.id}
            </div>

            <span class="status ${escapeHtml(status)}">
              ${escapeHtml(status)}
            </span>

          </div>


          <div class="order-info">

            <div class="info-box">

              <strong>
                Customer
              </strong>

              ${escapeHtml(customerName)}

            </div>


            <div class="info-box">

              <strong>
                Phone
              </strong>

              ${escapeHtml(customerPhone)}

            </div>


            <div class="info-box">

              <strong>
                Email
              </strong>

              ${escapeHtml(customerEmail)}

            </div>


            <div class="info-box">

              <strong>
                Delivery Area
              </strong>

              ${escapeHtml(area)}

            </div>


            <div class="info-box">

              <strong>
                Payment Method
              </strong>

              ${escapeHtml(order.payment_method || "Not selected")}

            </div>


            <div class="info-box">

              <strong>
                Payment Status
              </strong>

              ${escapeHtml(order.payment_status || "pending")}

            </div>


            <div
              class="info-box"
              style="grid-column: 1 / -1;"
            >

              <strong>
                Delivery Address
              </strong>

              ${escapeHtml(address)}

            </div>

          </div>


          <div class="items-title">

            <strong>
              🛍️ Products
            </strong>

          </div>


          <div class="items">

            <div style="color:#777; padding:10px 0;">
              Loading product details...
            </div>

          </div>


          <div class="order-total">

            <p>
              Subtotal:
              ৳${Number(order.subtotal || 0).toFixed(0)}
            </p>

            <p>
              Delivery Charge:
              ৳${Number(order.delivery_charge || 0).toFixed(0)}
            </p>

            <p class="grand-total">
              Total:
              ৳${Number(order.total_amount || 0).toFixed(0)}
            </p>

          </div>


          ${
            status === "cancelled" &&
            order.cancellation_reason
            ? `
              <div
                class="info-box"
                style="margin-top:15px;"
              >
                <strong>
                  Cancellation Reason
                </strong>

                ${escapeHtml(order.cancellation_reason)}
              </div>
            `
            : ""
          }


          <div class="order-actions">

            ${
              status === "pending"
              ? `

                <button
                  class="accept-btn"
                  onclick="acceptOrder(${order.id})"
                >
                  ✓ Accept
                </button>

                <button
                  class="cancel-btn"
                  onclick="openCancelModal(${order.id})"
                >
                  ✕ Cancel
                </button>

              `
              : ""
            }


            ${
              status !== "cancelled" &&
              status !== "delivered"
              ? `

                <select
                  class="status-select"
                  onchange="updateOrderStatus(${order.id}, this.value)"
                >

                  <option value="">
                    Change Status
                  </option>

                  <option value="pending">
                    Pending
                  </option>

                  <option value="accepted">
                    Accepted
                  </option>

                  <option value="processing">
                    Processing
                  </option>

                  <option value="shipped">
                    Shipped
                  </option>

                  <option value="delivered">
                    Delivered
                  </option>

                </select>

              `
              : ""
            }

          </div>

        `;


        container.appendChild(card);


        loadOrderItems(
          order.id,
          card.querySelector(".items")
        );

      });

    }


    /* =========================
       LOAD ORDER ITEMS
    ========================= */

    async function loadOrderItems(orderId, container) {

      try {

        const data =
          await apiRequest(
            `/api/admin/orders/${orderId}`
          );


        const items =
          data.order &&
          Array.isArray(data.order.items)
            ? data.order.items
            : [];


        if (items.length === 0) {

          container.innerHTML = `
            <div style="color:#777; padding:10px 0;">
              No products found.
            </div>
          `;

          return;
        }


        container.innerHTML =
          items
            .map(item => {

              const image =
                item.image_url ||
                "https://via.placeholder.com/100";


              return `

                <div class="order-item">

                  <img
                    class="item-image"
                    src="${escapeAttribute(image)}"
                    alt="${escapeAttribute(item.product_name || "Product")}"
                  >

                  <div class="item-info">

                    <strong>
                      ${escapeHtml(item.product_name || "Product")}
                    </strong>

                    <span>
                      Quantity:
                      ${Number(item.quantity || 0)}
                      × ৳${Number(item.price || 0).toFixed(0)}
                    </span>

                    ${
                      item.selected_size
                      ? `
                        <span>
                          Size: ${escapeHtml(item.selected_size)}
                        </span>
                      `
                      : ""
                    }

                    ${
                      item.selected_color
                      ? `
                        <span>
                          Color: ${escapeHtml(item.selected_color)}
                        </span>
                      `
                      : ""
                    }

                  </div>

                </div>

              `;

            })
            .join("");


      } catch (error) {

        console.error(error);

        container.innerHTML = `
          <div style="color:#c00000; padding:10px 0;">
            Could not load products.
          </di

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orders | Sarah's World Admin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    /* SIDEBAR */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: #111;
      color: white;
      padding: 25px 15px;
    }

    .sidebar h1 {
      font-size: 22px;
      margin-bottom: 30px;
      padding-left: 10px;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 13px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #292929;
    }

    .logout {
      position: absolute;
      bottom: 25px;
      left: 15px;
      right: 15px;
      width: calc(100% - 30px);
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #d00000;
      color: white;
      cursor: pointer;
    }

    /* MAIN */

    .main {
      margin-left: 240px;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .topbar h2 {
      font-size: 28px;
    }

    .refresh-btn {
      border: none;
      background: #111;
      color: white;
      padding: 11px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    /* FILTERS */

    .filters {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .filters select,
    .filters input {
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    /* ORDER */

    .orders-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .order-card {
      background: white;
      border-radius: 10px;
      padding: 22px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .order-id {
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
    }

    .pending {
      background: #fff3cd;
      color: #856404;
    }

    .accepted {
      background: #e7f8ed;
      color: #16833b;
    }

    .cancelled {
      background: #ffe8e8;
      color: #c00000;
    }

    .order-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-box {
      background: #f8f8f8;
      padding: 12px;
      border-radius: 6px;
    }

    .info-box strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #666;
    }

    /* PRODUCTS */

    .items-title {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .order-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .item-image {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      background: #eee;
    }

    .item-info {
      flex: 1;
    }

    .item-info strong {
      display: block;
      margin-bottom: 4px;
    }

    .item-info span {
      color: #666;
      font-size: 13px;
    }

    /* TOTAL */

    .order-total {
      text-align: right;
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 10px;
    }

    .order-total p {
      margin: 5px 0;
    }

    .grand-total {
      font-size: 21px;
      font-weight: bold;
    }

    /* ACTIONS */

    .order-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .accept-btn,
    .cancel-btn {
      border: none;
      padding: 10px 17px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .accept-btn {
      background: #16833b;
      color: white;
    }

    .cancel-btn {
      background: #d00000;
      color: white;
    }

    .disabled-btn {
      background: #ccc;
      color: #666;
      cursor: not-allowed;
    }

    /* EMPTY */

    .empty {
      background: white;
      padding: 50px;
      text-align: center;
      border-radius: 10px;
      color: #777;
    }

    /* MODAL */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    .modal-box h3 {
      margin-bottom: 15px;
    }

    .modal-box textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    .modal-actions button {
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .confirm-cancel {
      background: #d00000;
      color: white;
    }

    .close-modal {
      background: #ddd;
    }

    @media (max-width: 700px) {

      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        padding: 15px;
      }

      .sidebar h1 {
        margin-bottom: 15px;
      }

      .sidebar a {
        display: inline-block;
        margin-right: 5px;
      }

      .logout {
        position: static;
        width: 100%;
        margin-top: 10px;
      }

      .main {
        margin-left: 0;
        padding: 20px 15px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .order-info {
        grid-template-columns: 1fr;
      }

      .order-header {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
      }

      .order-actions {
        justify-content: stretch;
      }

      .accept-btn,
      .cancel-btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- SIDEBAR -->

  <aside class="sidebar">

    <h1>Sarah's World</h1>

    <a href="index.html">
      🏠 Dashboard
    </a>

    <a href="products.html">
      🛍️ Products
    </a>

    <a href="orders.html" class="active">
      📦 Orders
    </a>

    <a href="users.html">
      👥 Users
    </a>

    <a href="settings.html">
      ⚙️ Settings
    </a>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </aside>


  <!-- MAIN -->

  <main class="main">

    <div class="topbar">

      <h2>Orders</h2>

      <button
        class="refresh-btn"
        onclick="loadOrders()"
      >
        🔄 Refresh
      </button>

    </div>


    <!-- FILTERS -->

    <div class="filters">

      <select id="status-filter" onchange="filterOrders()">

        <option value="all">
          All Orders
        </option>

        <option value="pending">
          Pending
        </option>

        <option value="accepted">
          Accepted
        </option>

        <option value="cancelled">
          Cancelled
        </option>

      </select>

      <input
        type="search"
        id="search-order"
        placeholder="Search order ID..."
        oninput="filterOrders()"
      >

    </div>


    <!-- ORDERS -->

    <div
      class="orders-container"
      id="orders-container"
    >

      <div class="empty">

        📦

        <br><br>

        Orders will appear here after connecting the Admin Orders API.

      </div>

    </div>

  </main>


  <!-- CANCEL MODAL -->

  <div
    class="modal"
    id="cancel-modal"
  >

    <div class="modal-box">

      <h3>
        Cancel Order
      </h3>

      <p style="margin-bottom: 12px; color: #666;">
        You can provide a reason for cancelling this order.
        If you leave it empty, the default cancellation reason
        will be used.
      </p>

      <textarea
        id="cancel-reason"
        placeholder="Write cancellation reason (optional)"
      ></textarea>

      <div class="modal-actions">

        <button
          class="close-modal"
          onclick="closeCancelModal()"
        >
          Back
        </button>

        <button
          class="confirm-cancel"
          onclick="confirmCancel()"
        >
          Cancel Order
        </button>

      </div>

    </div>

  </div>


  <script>

    let selectedOrderId = null;

    let orders = [];


    /* =========================
       LOAD ORDERS
    ========================= */

    function loadOrders() {

      /*
        Admin Orders API will be connected here.

        Example later:

        fetch("/api/admin/orders")
      */

      renderOrders();

    }


    /* =========================
       RENDER ORDERS
    ========================= */

    function renderOrders(list = orders) {

      const container =
        document.getElementById("orders-container");

      if (list.length === 0) {

        container.innerHTML = `
          <div class="empty">
            📦
            <br><br>
            No orders found.
          </div>
        `;

        return;
      }


      container.innerHTML = "";


      list.forEach(order => {

        const card =
          document.createElement("div");

        card.className = "order-card";


        card.innerHTML = `

          <div class="order-header">

            <div class="order-id">
              Order #${order.id}
            </div>

            <span class="status ${order.status}">
              ${order.status}
            </span>

          </div>


          <div class="order-info">

            <div class="info-box">

              <strong>
                Customer
              </strong>

              ${order.customer_name || "Customer"}

            </div>


            <div class="info-box">

              <strong>
                Phone
              </strong>

              ${order.phone || "Not available"}

            </div>


            <div class="info-box">

              <strong>
                Delivery Area
              </strong>

              ${order.delivery_area || "Not available"}

            </div>


            <div class="info-box">

              <strong>
                Payment
              </strong>

              ${order.payment_method || "Not selected"}

            </div>


            <div class="info-box" style="grid-column: 1 / -1;">

              <strong>
                Delivery Address
              </strong>

              ${order.address || "Not available"}

            </div>

          </div>


          <div class="items-title">
            <strong>
              🛍️ Products
            </strong>
          </div>


          <div class="items">

            ${
              (order.items || [])
                .map(item => `

                  <div class="order-item">

                    <img
                      class="item-image"
                      src="${item.image || ""}"
                      alt="${item.name || "Product"}"
                    >

                    <div class="item-info">

                      <strong>
                        ${item.name || "Product"}
                      </strong>

                      <span>
                        Quantity: ${item.quantity || 1}
                        × ৳${item.price || 0}
                      </span>

                    </div>

                  </div>

                `)
                .join("")
            }

          </div>


          <div class="order-total">

            <p>
              Subtotal:
              ৳${order.subtotal || 0}
            </p>

            <p>
              Delivery Charge:
              ৳${order.delivery_charge || 0}
            </p>

            <p class="grand-total">
              Total:
              ৳${order.total_amount || 0}
            </p>

          </div>


          <div class="order-actions">

            ${
              order.status === "pending"
              ? `

                <button
                  class="accept-btn"
                  onclick="acceptOrder(${order.id})"
                >
                  ✓ Accept
                </button>

                <button
                  class="cancel-btn"
                  onclick="openCancelModal(${order.id})"
                >
                  ✕ Cancel
                </button>

              `
              : `

                <button
                  class="disabled-btn"
                  disabled
                >
                  Order ${order.status}
                </button>

              `
            }

          </div>

        `;


        container.appendChild(card);

      });

    }


    /* =========================
       FILTER
    ========================= */

    function filterOrders() {

      const status =
        document
          .getElementById("status-filter")
          .value;

      const search =
        document
          .getElementById("search-order")
          .value
          .trim()
          .toLowerCase();


      const filtered =
        orders.filter(order => {

          const statusMatch =
            status === "all" ||
            order.status === status;

          const searchMatch =
            !search ||
            String(order.id)
              .toLowerCase()
              .includes(search);

          return statusMatch && searchMatch;

        });


      renderOrders(filtered);

    }


    /* =========================
       ACCEPT ORDER
    ========================= */

    function acceptOrder(orderId) {

      /*
        Backend API will be connected here.

        Example later:

        fetch("/api/admin/orders/" + orderId + "/accept", {
          method: "PATCH"
        })
      */

      alert(
        "Order #" +
        orderId +
        " accept করার API connection next step-এ add হবে."
      );

    }


    /* =========================
       CANCEL MODAL
    ========================= */

    function openCancelModal(orderId) {

      selectedOrderId = orderId;

      document
        .getElementById("cancel-reason")
        .value = "";

      document
        .getElementById("cancel-modal")
        .style.display = "flex";

    }


    function closeCancelModal() {

      selectedOrderId = null;

      document
        .getElementById("cancel-modal")
        .style.display = "none";

    }


    /* =========================
       CONFIRM CANCEL
    ========================= */

    function confirmCancel() {

      if (!selectedOrderId) {
        return;
      }


      const reason =
        document
          .getElementById("cancel-reason")
          .value
          .trim();


      /*
        Backend API will be connected here.

        If reason is empty,
        backend will use the default
        cancellation reason.
      */


      alert(
        "Order #" +
        selectedOrderId +
        " cancellation API connection next step-এ add হবে."
      );


      closeCancelModal();

    }


    /* =========================
       LOGOUT
    ========================= */

    function logout() {

      localStorage.removeItem("token");
      localStorage.removeItem("authToken");

      window.location.href = "../index.html";

    }


    loadOrders();

  </script>

</body>
</html>

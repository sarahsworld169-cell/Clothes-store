<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Orders | Sarah's World Admin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    /* =========================
       SIDEBAR
    ========================= */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: #111;
      color: white;
      padding: 25px 15px;
    }

    .sidebar h1 {
      font-size: 22px;
      margin-bottom: 30px;
      padding-left: 10px;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 13px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #292929;
    }

    .logout {
      position: absolute;
      bottom: 25px;
      left: 15px;
      right: 15px;
      width: calc(100% - 30px);
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #d00000;
      color: white;
      cursor: pointer;
    }

    /* =========================
       MAIN
    ========================= */

    .main {
      margin-left: 240px;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .topbar h2 {
      font-size: 28px;
    }

    .refresh-btn {
      border: none;
      background: #111;
      color: white;
      padding: 11px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .refresh-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       FILTERS
    ========================= */

    .filters {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .filters select,
    .filters input {
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
      margin-right: 8px;
      margin-bottom: 8px;
    }

    /* =========================
       ORDERS
    ========================= */

    .orders-container {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .order-card {
      background: white;
      border-radius: 10px;
      padding: 22px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .order-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #eee;
      padding-bottom: 15px;
      margin-bottom: 15px;
    }

    .order-id {
      font-size: 19px;
      font-weight: bold;
    }

    .status {
      padding: 6px 11px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      text-transform: capitalize;
    }

    .pending {
      background: #fff3cd;
      color: #856404;
    }

    .accepted {
      background: #e7f8ed;
      color: #16833b;
    }

    .processing {
      background: #e7f0ff;
      color: #2457a6;
    }

    .shipped {
      background: #e8e8ff;
      color: #4a45a8;
    }

    .delivered {
      background: #dff7e7;
      color: #16833b;
    }

    .cancelled {
      background: #ffe8e8;
      color: #c00000;
    }

    /* =========================
       ORDER INFO
    ========================= */

    .order-info {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 20px;
    }

    .info-box {
      background: #f8f8f8;
      padding: 12px;
      border-radius: 6px;
    }

    .info-box strong {
      display: block;
      margin-bottom: 5px;
      font-size: 13px;
      color: #666;
    }

    /* =========================
       PRODUCTS
    ========================= */

    .items-title {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .order-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 0;
      border-bottom: 1px solid #eee;
    }

    .order-item:last-child {
      border-bottom: none;
    }

    .item-image {
      width: 55px;
      height: 55px;
      object-fit: cover;
      border-radius: 6px;
      background: #eee;
    }

    .item-info {
      flex: 1;
    }

    .item-info strong {
      display: block;
      margin-bottom: 4px;
    }

    .item-info span {
      color: #666;
      font-size: 13px;
    }

    /* =========================
       TOTAL
    ========================= */

    .order-total {
      text-align: right;
      border-top: 1px solid #eee;
      padding-top: 15px;
      margin-top: 10px;
    }

    .order-total p {
      margin: 5px 0;
    }

    .grand-total {
      font-size: 21px;
      font-weight: bold;
    }

    /* =========================
       ACTIONS
    ========================= */

    .order-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    .accept-btn,
    .cancel-btn,
    .details-btn {
      border: none;
      padding: 10px 17px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
    }

    .accept-btn {
      background: #16833b;
      color: white;
    }

    .cancel-btn {
      background: #d00000;
      color: white;
    }

    .details-btn {
      background: #111;
      color: white;
    }

    .disabled-btn {
      background: #ccc;
      color: #666;
      border: none;
      padding: 10px 17px;
      border-radius: 6px;
      cursor: not-allowed;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* =========================
       EMPTY
    ========================= */

    .empty {
      background: white;
      padding: 50px;
      text-align: center;
      border-radius: 10px;
      color: #777;
    }

    .loading {
      background: white;
      padding: 50px;
      text-align: center;
      border-radius: 10px;
      color: #555;
    }

    .error {
      background: #ffe8e8;
      color: #c00000;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
    }

    /* =========================
       MODAL
    ========================= */

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal-box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    .modal-box h3 {
      margin-bottom: 15px;
    }

    .modal-box textarea {
      width: 100%;
      min-height: 110px;
      resize: vertical;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 15px;
    }

    .modal-actions button {
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
    }

    .confirm-cancel {
      background: #d00000;
      color: white;
    }

    .close-modal {
      background: #ddd;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        padding: 15px;
      }

      .sidebar h1 {
        margin-bottom: 15px;
      }

      .sidebar a {
        display: inline-block;
        margin-right: 5px;
      }

      .logout {
        position: static;
        width: 100%;
        margin-top: 10px;
      }

      .main {
        margin-left: 0;
        padding: 20px 15px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
      }

      .order-info {
        grid-template-columns: 1fr;
      }

      .order-header {
        align-items: flex-start;
        gap: 10px;
        flex-direction: column;
      }

      .order-actions {
        justify-content: stretch;
        flex-wrap: wrap;
      }

      .accept-btn,
      .cancel-btn,
      .details-btn,
      .disabled-btn {
        flex: 1;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       SIDEBAR
  ========================= -->

  <aside class="sidebar">

    <h1>Sarah's World</h1>

    <a href="index.html">
      🏠 Dashboard
    </a>

    <a href="products.html">
      🛍️ Products
    </a>

    <a href="orders.html" class="active">
      📦 Orders
    </a>

    <a href="users.html">
      👥 Users
    </a>

    <a href="settings.html">
      ⚙️ Settings
    </a>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </aside>


  <!-- =========================
       MAIN
  ========================= -->

  <main class="main">

    <div class="topbar">

      <h2>Orders</h2>

      <button
        class="refresh-btn"
        id="refresh-btn"
        onclick="loadOrders()"
      >
        🔄 Refresh
      </button>

    </div>


    <!-- =========================
         FILTERS
    ========================= -->

    <div class="filters">

      <select
        id="status-filter"
        onchange="filterOrders()"
      >

        <option value="all">
          All Orders
        </option>

        <option value="pending">
          Pending
        </option>

        <option value="accepted">
          Accepted
        </option>

        <option value="processing">
          Processing
        </option>

        <option value="shipped">
          Shipped
        </option>

        <option value="delivered">
          Delivered
        </option>

        <option value="cancelled">
          Cancelled
        </option>

      </select>


      <input
        type="search"
        id="search-order"
        placeholder="Search order ID..."
        oninput="filterOrders()"
      >

    </div>


    <!-- =========================
         ORDERS
    ========================= -->

    <div
      class="orders-container"
      id="orders-container"
    >

      <div class="loading">
        Loading orders...
      </div>

    </div>

  </main>


  <!-- =========================
       CANCEL MODAL
  ========================= -->

  <div
    class="modal"
    id="cancel-modal"
  >

    <div class="modal-box">

      <h3>
        Cancel Order
      </h3>

      <p style="margin-bottom: 12px; color: #666;">
        You can provide a reason for cancelling this order.
        If you leave it empty, the default cancellation reason
        will be used.
      </p>

      <textarea
        id="cancel-reason"
        placeholder="Write cancellation reason (optional)"
      ></textarea>

      <div class="modal-actions">

        <button
          class="close-modal"
          onclick="closeCancelModal()"
        >
          Back
        </button>

        <button
          class="confirm-cancel"
          id="confirm-cancel-btn"
          onclick="confirmCancel()"
        >
          Cancel Order
        </button>

      </div>

    </div>

  </div>


  <script>

    /* =========================
       API BASE
    ========================= */

    const API_BASE = "/api";


    /* =========================
       GLOBAL VARIABLES
    ========================= */

    let selectedOrderId = null;

    let orders = [];


    /* =========================
       AUTH HEADERS
    ========================= */

    function getAuthHeaders() {

      const token =
        localStorage.getItem("token") ||
        localStorage.getItem("authToken");

      const headers = {
        "Content-Type": "application/json"
      };

      if (token) {
        headers.Authorization = `Bearer ${token}`;
      }

      return headers;
    }


    /* =========================
       LOAD ORDERS
    ========================= */

    async function loadOrders() {

      const container =
        document.getElementById("orders-container");

      const refreshButton =
        document.getElementById("refresh-btn");


      refreshButton.disabled = true;

      container.innerHTML = `
        <div class="loading">
          🔄 Loading orders...
        </div>
      `;


      try {

        const response =
          await fetch(
            `${API_BASE}/admin/orders`,
            {
              method: "GET",
              headers: getAuthHeaders()
            }
          );


        const data =
          await response.json();


        if (!response.ok || !data.success) {

          throw new Error(
            data.message ||
            "Could not load orders."
          );

        }


        orders =
          Array.isArray(data.orders)
            ? data.orders
            : [];


        filterOrders();


      } catch (error) {

        console.error(error);

        container.innerHTML = `
          <div class="error">
            ❌ ${escapeHtml(
              error.message ||
              "Could not load orders."
            )}

            <br><br>

            <button
              class="details-btn"
              onclick="loadOrders()"
            >
              Try Again
            </button>
          </div>
        `;

      } finally {

        refreshButton.disabled = false;

      }

    }


    /* =========================
       RENDER ORDERS
    ========================= */

    function renderOrders(list = orders) {

      const container =
        document.getElementById("orders-container");


      if (!list.length) {

        container.innerHTML = `
          <div class="empty">
            📦
            <br><br>
            No orders found.
          </div>
        `;

        return;

      }


      container.innerHTML = "";


      list.forEach(order => {

        const card =
          document.createElement("div");

        card.className = "order-card";


        const status =
          String(
            order.order_status ||
            order.status ||
            "pending"
          ).toLowerCase();


        const customerName =
          order.customer_name ||
          "Customer";


        const customerEmail =
          order.customer_email ||
          "Not available";


        const customerPhone =
          order.customer_phone ||
          "Not available";


        const deliveryArea =
          order.area_name ||
          "Not available";


        const address =
          order.delivery_address ||
          "Not available";


        const paymentMethod =
          order.payment_method ||
          "Not selected";


        const subtotal =
          Number(order.subtotal || 0);


        const deliveryCharge =
          Number(order.delivery_charge || 0);


        const totalAmount =
          Number(order.total_amount || 0);


        card.innerHTML = `

          <div class="order-header">

            <div class="order-id">
              Order #${escapeHtml(order.id)}
            </div>

            <span class="status ${escapeHtml(status)}">
              ${escapeHtml(status)}
            </span>

          </div>


          <div class="order-info">

            <div class="info-box">

              <strong>
                Customer
              </strong>

              ${escapeHtml(customerName)}

            </div>


            <div class="info-box">

              <strong>
                Email
              </strong>

              ${escapeHtml(customerEmail)}

            </div>


            <div class="info-box">

              <strong>
                Phone
              </strong>

              ${escapeHtml(customerPhone)}

            </div>


            <div class="info-box">

              <strong>
                Delivery Area
              </strong>

              ${escapeHtml(deliveryArea)}

            </div>


            <div class="info-box">

              <strong>
                Payment
              </strong>

              ${escapeHtml(paymentMethod)}

            </div>


            <div class="info-box">

              <strong>
                Payment Status
              </strong>

              ${escapeHtml(
                order.payment_status ||
                "pending"
              )}

            </div>


            <div
              class="info-box"
              style="grid-column: 1 / -1;"
            >

              <strong>
                Delivery Address
              </strong>

              ${escapeHtml(address)}

            </div>

          </div>


          <div class="items-title">

            <strong>
              🛍️ Products
            </strong>

          </div>


          <div class="items">

            ${
              renderItems(order.items)
            }

          </div>


          <div class="order-total">

            <p>
              Subtotal:
              ৳${subtotal}
            </p>

            <p>
              Delivery Charge:
              ৳${deliveryCharge}
            </p>

            <p class="grand-total">
              Total:
              ৳${totalAmount}
            </p>

          </div>


          <div class="order-actions">

            <button
              class="details-btn"
              onclick="viewOrder(${Number(order.id)})"
            >
              👁 View
            </button>


            ${
              status === "pending"
              ? `

                <button
                  class="accept-btn"
                  onclick="acceptOrder(${Number(order.id)})"
                >
                  ✓ Accept
                </button>

                <button
                  class="cancel-btn"
                  onclick="openCancelModal(${Number(order.id)})"
                >
                  ✕ Cancel
                </button>

              `
              : `

                <button
                  class="disabled-btn"
                  disabled
                >
                  Order ${escapeHtml(status)}
                </button>

              `
            }

          </div>

        `;


        container.appendChild(card);

      });

    }


    /* =========================
       RENDER ITEMS
    ========================= */

    function renderItems(items) {

      if (!Array.isArray(items) || !items.length) {

        return `
          <p style="color:#777; padding:10px 0;">
            No product information available.
          </p>
        `;

      }


      return items
        .map(item => {

          const image =
            item.image_url ||
            item.image ||
            "";


          const name =
            item.product_name ||
            item.name ||
            "Product";


          const quantity =
            Number(item.quantity || 1);


          const price =
            Number(item.price || 0);


          return `

            <div class="order-item">

              ${
                image
                ? `
                  <img
                    class="item-image"
                    src="${escapeAttribute(image)}"
                    alt="${escapeAttribute(name)}"
                    onerror="this.style.display='none'"
                  >
                `
                : `
                  <div
                    class="item-image"
                    style="
                      display:flex;
                      align-items:center;
                      justify-content:center;
                      font-size:22px;
                    "
                  >
                    🛍️
                  </div>
                `
              }


              <div class="item-info">

                <strong>
                  ${escapeHtml(name)}
                </strong>

                <span>
                  Quantity:
                  ${quantity}
                  × ৳${price}

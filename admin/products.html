<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Products | Sarah's World Admin</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #111;
    }

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 240px;
      height: 100vh;
      background: #111;
      color: white;
      padding: 25px 15px;
    }

    .sidebar h1 {
      font-size: 22px;
      margin-bottom: 30px;
      padding-left: 10px;
    }

    .sidebar a {
      display: block;
      color: white;
      text-decoration: none;
      padding: 13px 12px;
      margin-bottom: 8px;
      border-radius: 6px;
    }

    .sidebar a:hover,
    .sidebar a.active {
      background: #292929;
    }

    .logout {
      position: absolute;
      bottom: 25px;
      left: 15px;
      right: 15px;
      width: calc(100% - 30px);
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #d00000;
      color: white;
      cursor: pointer;
    }

    .main {
      margin-left: 240px;
      padding: 30px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 25px;
    }

    .topbar h2 {
      font-size: 28px;
    }

    .add-btn {
      background: #111;
      color: white;
      border: none;
      padding: 12px 18px;
      border-radius: 6px;
      cursor: pointer;
    }

    .form-box {
      display: none;
      background: white;
      padding: 25px;
      border-radius: 10px;
      margin-bottom: 25px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .form-box h3 {
      margin-bottom: 20px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    .full {
      grid-column: 1 / -1;
    }

    .save-btn {
      background: #111;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
    }

    .cancel-btn {
      background: #ddd;
      color: #111;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
      cursor: pointer;
      margin-left: 8px;
    }

    .products-box {
      background: white;
      padding: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 15px rgba(0,0,0,0.06);
    }

    .products-box h3 {
      margin-bottom: 20px;
    }

    .product-row {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 15px 0;
      border-bottom: 1px solid #eee;
    }

    .product-row:last-child {
      border-bottom: none;
    }

    .product-image {
      width: 70px;
      height: 70px;
      object-fit: cover;
      border-radius: 7px;
      background: #eee;
    }

    .product-info {
      flex: 1;
    }

    .product-info h4 {
      margin-bottom: 6px;
    }

    .product-info p {
      color: #666;
      font-size: 14px;
      margin: 3px 0;
    }

    .status {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      font-size: 12px;
      margin-top: 5px;
    }

    .active-status {
      background: #e7f8ed;
      color: #16833b;
    }

    .inactive-status {
      background: #ffe8e8;
      color: #c00000;
    }

    .product-actions {
      display: flex;
      gap: 7px;
    }

    .edit-btn,
    .delete-btn {
      border: none;
      padding: 8px 11px;
      border-radius: 5px;
      cursor: pointer;
    }

    .edit-btn {
      background: #eee;
    }

    .delete-btn {
      background: #d00000;
      color: white;
    }

    .empty {
      text-align: center;
      padding: 35px;
      color: #777;
    }

    @media (max-width: 700px) {

      .sidebar {
        position: relative;
        width: 100%;
        height: auto;
        padding: 15px;
      }

      .sidebar h1 {
        margin-bottom: 15px;
      }

      .sidebar a {
        display: inline-block;
        margin-right: 5px;
      }

      .logout {
        position: static;
        width: 100%;
        margin-top: 10px;
      }

      .main {
        margin-left: 0;
        padding: 20px 15px;
      }

      .topbar {
        align-items: flex-start;
        gap: 12px;
        flex-direction: column;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .full {
        grid-column: auto;
      }

      .product-row {
        align-items: flex-start;
      }

      .product-actions {
        flex-direction: column;
      }

      .product-image {
        width: 60px;
        height: 60px;
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">

    <h1>Sarah's World</h1>

    <a href="index.html">
      🏠 Dashboard
    </a>

    <a href="products.html" class="active">
      🛍️ Products
    </a>

    <a href="orders.html">
      📦 Orders
    </a>

    <a href="users.html">
      👥 Users
    </a>

    <a href="settings.html">
      ⚙️ Settings
    </a>

    <button class="logout" onclick="logout()">
      Logout
    </button>

  </aside>


  <main class="main">

    <div class="topbar">

      <h2>Products</h2>

      <button class="add-btn" onclick="showForm()">
        + Add Product
      </button>

    </div>


    <!-- ADD PRODUCT FORM -->

    <div class="form-box" id="form-box">

      <h3>Add New Product</h3>

      <div class="form-grid">

        <input
          type="text"
          id="product-name"
          placeholder="Product Name"
        >

        <input
          type="number"
          id="product-price"
          placeholder="Price"
          min="0"
        >

        <input
          type="number"
          id="product-discount"
          placeholder="Discount Price (optional)"
          min="0"
        >

        <input
          type="number"
          id="product-stock"
          placeholder="Stock"
          min="0"
        >

        <input
          type="text"
          id="product-image"
          placeholder="Image URL"
        >

        <select id="product-status">

          <option value="true">
            Active
          </option>

          <option value="false">
            Inactive
          </option>

        </select>

        <textarea
          class="full"
          id="product-description"
          placeholder="Product Description"
        ></textarea>

      </div>

      <br>

      <button class="save-btn" onclick="saveProduct()">
        Save Product
      </button>

      <button class="cancel-btn" onclick="hideForm()">
        Cancel
      </button>

    </div>


    <!-- PRODUCTS -->

    <div class="products-box">

      <h3>All Products</h3>

      <div id="products-list">

        <div class="empty">
          🛍️ Products will appear here after connecting the database.
        </div>

      </div>

    </div>

  </main>


  <script>

    function showForm() {
      document.getElementById("form-box").style.display = "block";
      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });
    }


    function hideForm() {
      document.getElementById("form-box").style.display = "none";
    }


    function saveProduct() {

      const name =
        document.getElementById("product-name").value.trim();

      const price =
        document.getElementById("product-price").value;

      const stock =
        document.getElementById("product-stock").value;

      if (!name || !price || stock === "") {

        alert("Please fill in product name, price and stock.");

        return;
      }

      /*
        Backend API will be connected here.
      */

      alert(
        "Product form is ready. Backend connection will be added next."
      );
    }


    function logout() {

      localStorage.removeItem("token");
      localStorage.removeItem("authToken");

      window.location.href = "../index.html";

    }

  </script>

</body>
</html>
